services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: govknowledge-postgres

    environment:
      POSTGRES_DB: govknowledge
      POSTGRES_USER: govknowledge
      POSTGRES_PASSWORD: govknowledge_dev

    ports:
      - "5432:5432"

    volumes:
      - govknowledge_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U govknowledge -d govknowledge"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  govknowledge_postgres_data:
