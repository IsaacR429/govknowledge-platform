[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "govknowledge-backend"
version = "0.1.0"
description = "GovKnowledge - Government Knowledge Assistant backend"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pgvector",
    "python-multipart",
    "pwdlib[argon2]",
    "docling==2.65.0",
    "docling-core==2.96.0",
    "docling-ibm-models==3.15.0",
    "docling-parse==4.7.3",
    "rapidocr==3.9.2",
    "onnxruntime==1.30.0",
    "torch==2.14.0",
    "sentence-transformers==5.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx>=0.28.1,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
